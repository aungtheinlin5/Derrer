<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub - Watch Videos</title>
<script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
<style>
:root{
  --bg:#0f1115;
  --bg-soft:#171a21;
  --card:#1c2029;
  --border:#2a2f3a;
  --text:#e8eaed;
  --text-dim:#9aa0ab;
  --accent:#6c5ce7;
  --accent-hover:#8177f0;
  --danger:#e74c3c;
  --danger-hover:#f1594a;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none;}

/* NAVBAR */
.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 32px;
  background:var(--bg-soft);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:50;
}
.navbar .logo{
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}
.navbar .logo span{color:var(--accent);}
.navbar .nav-links{display:flex;gap:20px;align-items:center;}
.navbar .nav-links a{
  color:var(--text-dim);
  font-size:14px;
  padding:8px 14px;
  border-radius:8px;
  transition:.2s;
}
.navbar .nav-links a:hover{background:var(--card);color:var(--text);}

.container{
  max-width:1200px;
  margin:0 auto;
  padding:28px 24px 60px;
}

/* SEARCH BAR */
.search-bar{
  display:flex;
  gap:10px;
  margin-bottom:28px;
}
input, textarea, select{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 14px;
  border-radius:8px;
  font-size:14px;
  width:100%;
  outline:none;
  transition:.2s;
}
input:focus, textarea:focus, select:focus{border-color:var(--accent);}
button{
  cursor:pointer;
  border:none;
  border-radius:8px;
  padding:11px 20px;
  font-size:14px;
  font-weight:600;
  background:var(--accent);
  color:#fff;
  transition:.2s;
}
button:hover{background:var(--accent-hover);}
button.danger{background:var(--danger);}
button.danger:hover{background:var(--danger-hover);}
button.secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
button.secondary:hover{background:#242833;}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}
.video-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  display:flex;
  flex-direction:column;
}
.video-card:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
}
.thumb-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  position:relative;
}
.thumb-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.thumb-wrap .no-thumb{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);
  font-size:13px;
}
.video-info{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px;}
.video-title{font-size:15px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.video-meta{font-size:12px;color:var(--text-dim);}

/* EMPTY / LOADING */
.empty-state, .loading-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-dim);
}

/* MODAL PLAYER */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.active{display:flex;}
.modal-box{
  background:var(--bg-soft);
  border-radius:var(--radius);
  max-width:900px;
  width:100%;
  overflow:hidden;
  border:1px solid var(--border);
}
.modal-box video{width:100%;max-height:70vh;background:#000;display:block;}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;
}
.modal-header h3{font-size:16px;}
.modal-close{
  background:transparent;color:var(--text-dim);font-size:20px;padding:4px 10px;
}
.modal-close:hover{color:var(--text);background:var(--card);}
.modal-body{padding:0 20px 20px;color:var(--text-dim);font-size:13px;}

.toast{
  position:fixed;
  bottom:24px;right:24px;
  background:var(--card);
  border:1px solid var(--border);
  padding:14px 18px;
  border-radius:10px;
  font-size:14px;
  z-index:200;
  display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{display:block;}
.toast.error{border-color:var(--danger);}
.toast.success{border-color:#2ecc71;}

.hidden{display:none !important;}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">📺 Video<span>Hub</span></div>
  <div class="nav-links">
    <a href="user.html">Home</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ရှာလိုသောဗီဒီယိုအမည် ရိုက်ထည့်ပါ...">
    <select id="categoryFilter" style="max-width:180px;">
      <option value="">အားလုံးကဏ္ဍ</option>
    </select>
  </div>

  <!-- Ad Slot -->
  <div style="margin-bottom:24px;text-align:center;">
    <ins class="eas6a97888e10" data-zoneid="5993032"></ins>
    <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
  </div>

  <div id="loading" class="loading-state">Video များ တင်နေပါသည်...</div>
  <div id="emptyState" class="empty-state hidden">ဗီဒီယိုမရှိသေးပါ</div>
  <div class="video-grid" id="videoGrid"></div>
</div>

<!-- Video Player Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <video id="modalVideo" controls autoplay></video>
    <div class="modal-body" id="modalDesc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fpjyqhiribgoxeloezkh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0_CyqdKA9wbSM0DLARY7kQ_BQicLglt";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script>
let allVideos = [];

function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  setTimeout(() => t.classList.remove("show"), 3000);
}

async function loadVideos() {
  const loading = document.getElementById("loading");
  const emptyState = document.getElementById("emptyState");
  loading.classList.remove("hidden");

  const { data, error } = await supabaseClient
    .from("videos")
    .select("*")
    .order("created_at", { ascending: false });

  loading.classList.add("hidden");

  if (error) {
    showToast("ဒေတာရယူရာတွင် အမှားဖြစ်ပါသည်: " + error.message, "error");
    console.error(error);
    return;
  }

  allVideos = data || [];

  if (allVideos.length === 0) {
    emptyState.classList.remove("hidden");
    return;
  }
  emptyState.classList.add("hidden");

  populateCategories(allVideos);
  renderVideos(allVideos);
}

function populateCategories(videos) {
  const select = document.getElementById("categoryFilter");
  const cats = [...new Set(videos.map(v => v.category || "Others"))];
  select.innerHTML = '<option value="">အားလုံးကဏ္ဍ</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
}

function renderVideos(videos) {
  const grid = document.getElementById("videoGrid");
  if (videos.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">ရလဒ်မတွေ့ပါ</div>`;
    return;
  }
  grid.innerHTML = videos.map(v => `
    <div class="video-card" onclick="openVideo('${v.id}')">
      <div class="thumb-wrap">
        ${v.thumbnail_url
          ? `<img src="${escapeHtml(v.thumbnail_url)}" alt="${escapeHtml(v.title)}" onerror="this.parentElement.innerHTML='<div class=&quot;no-thumb&quot;>No Thumbnail</div>'">`
          : `<div class="no-thumb">No Thumbnail</div>`}
      </div>
      <div class="video-info">
        <div class="video-title">${escapeHtml(v.title)}</div>
        <div class="video-meta">${escapeHtml(v.category || "Others")} • ${v.views || 0} views</div>
      </div>
    </div>
  `).join("");
}

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function filterVideos() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const cat = document.getElementById("categoryFilter").value;
  let filtered = allVideos;
  if (q) filtered = filtered.filter(v => v.title.toLowerCase().includes(q));
  if (cat) filtered = filtered.filter(v => (v.category || "Others") === cat);
  renderVideos(filtered);
}

document.getElementById("searchInput").addEventListener("input", filterVideos);
document.getElementById("categoryFilter").addEventListener("change", filterVideos);

async function openVideo(id) {
  const v = allVideos.find(x => x.id === id);
  if (!v) return;

  document.getElementById("modalTitle").textContent = v.title;
  document.getElementById("modalDesc").textContent = v.description || "";
  const videoEl = document.getElementById("modalVideo");
  videoEl.src = v.video_url;
  document.getElementById("modalOverlay").classList.add("active");

  // views count +1 (increment_views function must exist in Supabase)
  const { error } = await supabaseClient.rpc("increment_views", { video_id: id });
  if (!error) {
    v.views = (v.views || 0) + 1;
  }
}

function closeModal() {
  const videoEl = document.getElementById("modalVideo");
  videoEl.pause();
  videoEl.src = "";
  document.getElementById("modalOverlay").classList.remove("active");
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});

loadVideos();
</script>
</body>
</html>
